<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1020" width="1060" height="1020">
  <defs>
    <!-- Drop shadow for ovals matching the sample image -->
    <filter id="shadow" x="-8%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="2" flood-color="#047857" flood-opacity="0.18" />
    </filter>
    <!-- Triangle marker for generalization -->
    <marker id="triangle" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#ffffff" stroke="#047857" stroke-width="1.2" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" />

  <!-- Grid Background Pattern -->
  <g stroke="#e2e8f0" stroke-width="0.75" opacity="0.6">
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)" />
  </g>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="140" y="30" width="770" height="960" fill="#ecfdf5" stroke="#047857" stroke-width="1.8" />
  <text x="525" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#064e3b">Overview Use Case Diagram - MOTORENT System</text>

  <!-- ================= LINES (ASSOCIATIONS) ================= -->
  <g stroke="#047857" stroke-width="1.1" stroke-opacity="0.85">
    <!-- From Guest -->
    <line x1="75" y1="200" x2="230" y2="108" />
    <line x1="75" y1="200" x2="180" y2="178" />
    <line x1="75" y1="200" x2="230" y2="243" />

    <!-- From Customer to Left Use Cases -->
    <line x1="75" y1="670" x2="180" y2="178" />
    <line x1="75" y1="670" x2="180" y2="598" />
    <line x1="75" y1="670" x2="190" y2="654" />
    <line x1="75" y1="670" x2="210" y2="708" />
    <line x1="75" y1="670" x2="200" y2="763" />
    <line x1="75" y1="670" x2="175" y2="819" />
    <line x1="75" y1="670" x2="200" y2="873" />

    <!-- From Customer to Center Shared -->
    <line x1="75" y1="670" x2="450" y2="128" />
    <line x1="75" y1="670" x2="450" y2="188" />
    <line x1="75" y1="670" x2="455" y2="248" />
    <line x1="75" y1="670" x2="455" y2="338" />
    <line x1="75" y1="670" x2="460" y2="408" />
    <line x1="75" y1="670" x2="435" y2="478" />
    <line x1="75" y1="670" x2="420" y2="549" />

    <!-- From Staff to Top Right Use Cases -->
    <line x1="965" y1="200" x2="825" y2="93" />
    <line x1="965" y1="200" x2="835" y2="148" />
    <line x1="965" y1="200" x2="845" y2="203" />
    <line x1="965" y1="200" x2="835" y2="258" />

    <!-- From Staff to Center Shared -->
    <line x1="965" y1="200" x2="600" y2="128" />
    <line x1="965" y1="200" x2="610" y2="188" />
    <line x1="965" y1="200" x2="605" y2="248" />
    <line x1="965" y1="200" x2="605" y2="338" />
    <line x1="965" y1="200" x2="600" y2="408" />
    <line x1="965" y1="200" x2="605" y2="478" />

    <!-- From Branch Manager to Mid Right Use Cases -->
    <line x1="965" y1="500" x2="840" y2="398" />
    <line x1="965" y1="500" x2="830" y2="453" />
    <line x1="965" y1="500" x2="835" y2="508" />
    <line x1="965" y1="500" x2="835" y2="563" />

    <!-- From Branch Manager to Center Shared -->
    <line x1="965" y1="500" x2="605" y2="478" />
    <line x1="965" y1="500" x2="615" y2="549" />

    <!-- From Admin to Bottom Right Use Cases -->
    <line x1="965" y1="820" x2="840" y2="743" />
    <line x1="965" y1="820" x2="835" y2="798" />
    <line x1="965" y1="820" x2="835" y2="853" />
    <line x1="965" y1="820" x2="840" y2="908" />

    <!-- From Admin to Center Shared -->
    <line x1="965" y1="820" x2="605" y2="478" />
    <line x1="965" y1="820" x2="615" y2="549" />
  </g>

  <!-- ================= GENERALIZATION ARROWS ================= -->
  <g stroke="#047857" stroke-width="1.3" fill="none">
    <!-- Customer -> Guest -->
    <line x1="75" y1="640" x2="75" y2="245" marker-end="url(#triangle)" />

    <!-- Staff -> Guest (Loop over top of diagram) -->
    <path d="M 965 170 L 965 15 L 45 15 L 45 190 L 60 190" marker-end="url(#triangle)" />

    <!-- Branch Manager -> Staff -->
    <line x1="965" y1="470" x2="965" y2="245" marker-end="url(#triangle)" />

    <!-- Admin -> Branch Manager -->
    <line x1="965" y1="790" x2="965" y2="545" marker-end="url(#triangle)" />
  </g>

  <!-- ================= USE CASES (OVALS) ================= -->
  <!-- Top Left: Guest -->
  <g filter="url(#shadow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#064e3b" text-anchor="middle">
    <!-- 1. Search motorbike & branches -->
    <g transform="translate(230, 90)">
      <rect width="175" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="87.5" y="22.5">Search motorbike &amp; branches</text>
    </g>

    <!-- 2. View vehicle details & pricing -->
    <g transform="translate(180, 160)">
      <rect width="175" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="87.5" y="22.5">View vehicle details &amp; pricing</text>
    </g>

    <!-- 3. Register account -->
    <g transform="translate(230, 225)">
      <rect width="150" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="75" y="22.5">Register account</text>
    </g>

    <!-- ================= CENTER SHARED OVALS ================= -->
    <!-- 4. Give feedback -->
    <g transform="translate(450, 110)">
      <rect width="150" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="75" y="22.5">Give feedback &amp; review</text>
    </g>

    <!-- 5. Report incident -->
    <g transform="translate(450, 170)">
      <rect width="160" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="80" y="22.5">Report incident &amp; complaint</text>
    </g>

    <!-- 6. Track booking status -->
    <g transform="translate(455, 230)">
      <rect width="150" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="75" y="22.5">Track booking status</text>
    </g>

    <!-- 7. Pay deposit 30% online -->
    <g transform="translate(455, 320)">
      <rect width="150" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="75" y="22.5">Pay deposit 30% online</text>
    </g>

    <!-- 8. Live chat -->
    <g transform="translate(460, 390)">
      <rect width="140" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="70" y="22.5">Live chat with staff</text>
    </g>

    <!-- 9. View notifications -->
    <g transform="translate(435, 460)">
      <rect width="170" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="85" y="22.5">View notifications &amp; SMS</text>
    </g>

    <!-- 10. View wallet & transaction history -->
    <g transform="translate(420, 530)">
      <rect width="195" height="38" rx="19" ry="19" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="97.5" y="24">View rental &amp; payment history</text>
    </g>

    <!-- ================= TOP RIGHT (STAFF) ================= -->
    <!-- 11. Lookup booking -->
    <g transform="translate(645, 75)">
      <rect width="180" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="90" y="22.5">Lookup booking MV-xxxxxx</text>
    </g>

    <!-- 12. Check-in 5-point -->
    <g transform="translate(640, 130)">
      <rect width="195" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="97.5" y="22.5">Check-in &amp; 5-point check</text>
    </g>

    <!-- 13. Check-out & calculate late fee -->
    <g transform="translate(655, 185)">
      <rect width="190" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="95" y="22.5">Check-out &amp; late fee calculation</text>
    </g>

    <!-- 14. Confirm return & settle 70% -->
    <g transform="translate(635, 240)">
      <rect width="200" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="100" y="22.5">Confirm return &amp; collect 70%</text>
    </g>

    <!-- ================= MID RIGHT (BRANCH MANAGER) ================= -->
    <!-- 15. Transfer fleet -->
    <g transform="translate(635, 380)">
      <rect width="205" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="102.5" y="22.5">Transfer fleet between branches</text>
    </g>

    <!-- 16. Assign shifts -->
    <g transform="translate(655, 435)">
      <rect width="175" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="87.5" y="22.5">Assign staff work shifts</text>
    </g>

    <!-- 17. Periodic maintenance -->
    <g transform="translate(640, 490)">
      <rect width="195" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="97.5" y="22.5">Schedule periodic maintenance</text>
    </g>

    <!-- 18. Branch revenue & vehicle report -->
    <g transform="translate(645, 545)">
      <rect width="190" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="95" y="22.5">Branch revenue &amp; vehicle report</text>
    </g>

    <!-- ================= BOTTOM LEFT (CUSTOMER) ================= -->
    <!-- 19. Upload eKYC -->
    <g transform="translate(180, 580)">
      <rect width="175" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="87.5" y="22.5">Upload eKYC (CCCD &amp; GPLX)</text>
    </g>

    <!-- 20. Book 1-way rental -->
    <g transform="translate(190, 635)">
      <rect width="215" height="38" rx="19" ry="19" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="107.5" y="24">Book 1-way rental (Airport - Beach)</text>
    </g>

    <!-- 21. Sign e-contract -->
    <g transform="translate(210, 690)">
      <rect width="140" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="70" y="22.5">Sign e-contract</text>
    </g>

    <!-- 22. Request cancel & refund -->
    <g transform="translate(200, 745)">
      <rect width="160" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="80" y="22.5">Request cancel &amp; refund</text>
    </g>

    <!-- 23. Redeem loyalty points -->
    <g transform="translate(175, 800)">
      <rect width="195" height="38" rx="19" ry="19" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="97.5" y="24">Redeem loyalty points &amp; voucher</text>
    </g>

    <!-- 24. Update personal profile -->
    <g transform="translate(200, 855)">
      <rect width="160" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="80" y="22.5">Update personal profile</text>
    </g>

    <!-- ================= BOTTOM RIGHT (ADMIN) ================= -->
    <!-- 25. Manage branches & fleet policies -->
    <g transform="translate(645, 725)">
      <rect width="195" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="97.5" y="22.5">Manage branches &amp; fleet policies</text>
    </g>

    <!-- 26. Manage user accounts & RBAC -->
    <g transform="translate(650, 780)">
      <rect width="185" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="92.5" y="22.5">Manage user accounts &amp; RBAC</text>
    </g>

    <!-- 27. View audit logs -->
    <g transform="translate(665, 835)">
      <rect width="170" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="85" y="22.5">View audit logs (AuditLog)</text>
    </g>

    <!-- 28. Chain-wide financial reports -->
    <g transform="translate(650, 890)">
      <rect width="190" height="36" rx="18" ry="18" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="95" y="22.5">Chain-wide financial reports</text>
    </g>
  </g>

  <!-- ================= ACTORS (STICK FIGURES) ================= -->
  <!-- 1. Guest -->
  <g transform="translate(60, 175)" stroke="#047857" stroke-width="1.8" fill="#ffffff">
    <circle cx="15" cy="12" r="10" />
    <line x1="15" y1="22" x2="15" y2="44" />
    <line x1="0" y1="28" x2="30" y2="28" />
    <line x1="15" y1="44" x2="3" y2="62" />
    <line x1="15" y1="44" x2="27" y2="62" />
    <text x="15" y="78" stroke="none" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Guest</text>
  </g>

  <!-- 2. Customer -->
  <g transform="translate(60, 645)" stroke="#047857" stroke-width="1.8" fill="#ffffff">
    <circle cx="15" cy="12" r="10" />
    <line x1="15" y1="22" x2="15" y2="44" />
    <line x1="0" y1="28" x2="30" y2="28" />
    <line x1="15" y1="44" x2="3" y2="62" />
    <line x1="15" y1="44" x2="27" y2="62" />
    <text x="15" y="78" stroke="none" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Customer</text>
  </g>

  <!-- 3. Staff -->
  <g transform="translate(950, 175)" stroke="#047857" stroke-width="1.8" fill="#ffffff">
    <circle cx="15" cy="12" r="10" />
    <line x1="15" y1="22" x2="15" y2="44" />
    <line x1="0" y1="28" x2="30" y2="28" />
    <line x1="15" y1="44" x2="3" y2="62" />
    <line x1="15" y1="44" x2="27" y2="62" />
    <text x="15" y="78" stroke="none" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Staff</text>
  </g>

  <!-- 4. Branch Manager -->
  <g transform="translate(950, 475)" stroke="#047857" stroke-width="1.8" fill="#ffffff">
    <circle cx="15" cy="12" r="10" />
    <line x1="15" y1="22" x2="15" y2="44" />
    <line x1="0" y1="28" x2="30" y2="28" />
    <line x1="15" y1="44" x2="3" y2="62" />
    <line x1="15" y1="44" x2="27" y2="62" />
    <text x="15" y="78" stroke="none" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Branch</text>
    <text x="15" y="92" stroke="none" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Manager</text>
  </g>

  <!-- 5. Admin -->
  <g transform="translate(950, 795)" stroke="#047857" stroke-width="1.8" fill="#ffffff">
    <circle cx="15" cy="12" r="10" />
    <line x1="15" y1="22" x2="15" y2="44" />
    <line x1="0" y1="28" x2="30" y2="28" />
    <line x1="15" y1="44" x2="3" y2="62" />
    <line x1="15" y1="44" x2="27" y2="62" />
    <text x="15" y="78" stroke="none" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">System</text>
    <text x="15" y="92" stroke="none" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Admin</text>
  </g>
</svg>
